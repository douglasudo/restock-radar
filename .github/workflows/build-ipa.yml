name: Build iPhone app (.ipa)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -version | tee build.log
          xcodebuild \
            -project RestockRadar.xcodeproj \
            -target RestockRadar \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT="$PWD/build" \
            build 2>&1 | tee -a build.log

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/RestockRadar.app Payload/
          zip -qry RestockRadar.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: RestockRadar-ipa
          path: RestockRadar.ipa

      # Saves the build result (and the app when it builds) to the "ci-output" branch,
      # so the result can be read with plain git.
      - name: Publish build output
        if: always()
        run: |
          mkdir -p out
          touch build.log
          grep -E "error:|warning: .*(deprecated|never)|BUILD (SUCCEEDED|FAILED)|\*\* BUILD" build.log | head -400 > out/summary.txt || true
          tail -300 build.log > out/build-tail.log
          if [ -f RestockRadar.ipa ]; then cp RestockRadar.ipa out/; fi
          echo "commit=${{ github.sha }} status=${{ job.status }} run=${{ github.run_id }}" > out/status.txt
          cd out
          git init -q
          git checkout -q -b ci-output
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "CI output for ${{ github.sha }} (${{ job.status }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-output
